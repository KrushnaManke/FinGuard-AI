name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[app,api,test]' 
      - run: pytest
      - run: python -m finguard.rag_evaluation
      - run: python -m compileall -q src app tests
      - run: docker build -t finguard-ai:ci .
