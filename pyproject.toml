[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "0.1.0"
description = "Educational fraud detection and investigation analytics"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "scikit-learn>=1.1,<2",
  "joblib>=1.2,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.48,<2", "plotly>=5,<7"]
test = ["pytest>=7,<9", "httpx>=0.24,<1"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]
boosted = ["xgboost>=1.7,<3", "lightgbm>=4,<5"]
explain = ["shap>=0.45,<1"]
llm = ["openai>=1.30,<3", "langgraph>=0.2,<1", "chromadb>=0.5,<2"]
ops = ["mlflow>=2.12,<4", "wandb>=0.17,<1", "boto3>=1.34,<2"]
all = [
  "streamlit>=1.48,<2",
  "plotly>=5,<7",
  "pytest>=7,<9",
  "httpx>=0.24,<1",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "xgboost>=1.7,<3",
  "lightgbm>=4,<5",
  "shap>=0.45,<1",
  "openai>=1.30,<3",
  "langgraph>=0.2,<1",
  "chromadb>=0.5,<2",
  "mlflow>=2.12,<4",
  "wandb>=0.17,<1",
  "boto3>=1.34,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
