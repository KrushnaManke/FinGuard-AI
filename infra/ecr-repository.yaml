AWSTemplateFormatVersion: "2010-09-09"
Description: Private ECR repository for FinGuard demo container images.
Parameters:
  RepositoryName:
    Type: String
    Default: finguard-ai
Resources:
  FinGuardRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain the latest 20 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["sha-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {"type": "expire"}
              }
            ]
          }
Outputs:
  RepositoryUri:
    Value: !GetAtt FinGuardRepository.RepositoryUri
